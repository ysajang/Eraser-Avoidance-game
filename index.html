    <script>
        // eraser.png를 45도 회전시켜서 favicon으로 설정
        function setRotatedFavicon() {
            const img = new Image();
            img.crossOrigin = 'anonymous';

            img.onload = function () {
                // Canvas 생성 (favicon은 보통 32x32 또는 64x64 크기)
                const canvas = document.createElement('canvas');
                const size = 64; // favicon 크기
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');

                // 배경을 투명하게 설정
                ctx.clearRect(0, 0, size, size);

                // Canvas 중앙으로 이동
                ctx.save();
                ctx.translate(size / 2, size / 2);


                // 이미지 비율 유지하면서 favicon 크기에 맞게 조정
                const scale = Math.min(size / img.width, size / img.height); // 90% 크기로 여유 공간 확보
                const scaledWidth = img.width * scale;
                const scaledHeight = img.height * scale;

                // 이미지 그리기 (중앙 정렬)
                ctx.drawImage(img, -scaledWidth / 2, -scaledHeight / 2, scaledWidth, scaledHeight);

                ctx.restore();

                // Canvas를 data URL로 변환하여 favicon 설정
                const dataUrl = canvas.toDataURL('image/png');
                const link = document.createElement('link');
                link.rel = 'icon';
                link.type = 'image/png';
                link.href = dataUrl;

                // 기존 favicon 제거 후 새로 추가
                const existingLink = document.querySelector("link[rel='icon']");
                if (existingLink) {
                    existingLink.remove();
                }
                document.head.appendChild(link);
            };

            img.onerror = function () {
                // 이미지 로드 실패 시 기본 favicon 설정
                console.warn('Failed to load eraser.png for favicon');
            };

            // 이미지 로드 시작
            img.src = 'assets/eraser.png';
        }

        // 페이지 로드 시 favicon 설정
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', setRotatedFavicon);
        } else {
            setRotatedFavicon();
        }
    </script>
